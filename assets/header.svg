<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Sebastián Feo Murillo — Junior Developer">
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#34D399"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#818CF8"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1400 0" dur="7s" repeatCount="indefinite"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity="0.05"/></pattern><radialGradient id="a1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#34D399" stop-opacity="0.28"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
  <radialGradient id="a2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <radialGradient id="a3" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#818CF8" stop-opacity="0.2"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34D399" stop-opacity="0.8"/><stop offset="1" stop-color="#818CF8" stop-opacity="0.4"/></linearGradient>
</defs>
<rect width="1200" height="430" rx="24" fill="#0B1120"/>
<rect width="1200" height="430" rx="24" fill="url(#dots)"/>
<circle cx="230" cy="120" r="300" fill="url(#a1)"><animate attributeName="cx" values="230;330;230" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="980" cy="330" r="320" fill="url(#a2)"><animate attributeName="cy" values="330;250;330" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="620" cy="40" r="220" fill="url(#a3)"><animate attributeName="cx" values="620;520;620" dur="16s" repeatCount="indefinite"/></circle>

<!-- texto -->
<rect x="60" y="74" width="196" height="32" rx="16" fill="#111A2E" stroke="#1E2A44"/>
<circle cx="80" cy="90" r="5" fill="#34D399"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="94" y="95" font-family="'Segoe UI', Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94A3B8">Bucaramanga, Colombia</text>
<text x="58" y="182" font-family="'Segoe UI', Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#E2E8F0" letter-spacing="-1.5">Sebastián Feo</text>
<text x="58" y="250" font-family="'Segoe UI', Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="url(#g)" letter-spacing="-1.5">Murillo</text>
<text x="60" y="300" font-family="'Segoe UI', Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#E2E8F0">Junior Developer <tspan fill="#64748B">—</tspan> Backend con Java y Spring Boot</text>
<text x="60" y="334" font-family="'Segoe UI', Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#94A3B8">También construyo videojuegos en Unity y automatizaciones con n8n.</text>
<rect x="60" y="358" width="0" height="3" rx="1.5" fill="url(#g)"><animate attributeName="width" values="0;140;140;0" keyTimes="0;0.15;0.9;1" dur="9s" repeatCount="indefinite"/></rect>

<!-- tarjeta de código -->
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
  <rect x="712" y="62" width="440" height="262" rx="16" fill="#111A2E" fill-opacity="0.95" stroke="url(#edge)"/>
  <rect x="712" y="62" width="440" height="36" rx="16" fill="#0E1626"/><rect x="712" y="82" width="440" height="16" fill="#0E1626"/>
  <circle cx="736" cy="80" r="5" fill="#F87171"/><circle cx="754" cy="80" r="5" fill="#FBBF24"/><circle cx="772" cy="80" r="5" fill="#34D399"/>
  <text x="1134" y="85" text-anchor="end" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#64748B">ControladorDisponibilidad.java</text>
  <text x="738" y="128" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="14" opacity="0" xml:space="preserve"><tspan fill="#818CF8">@RestController</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.040;0.070;0.94;1" dur="9s" repeatCount="indefinite"/></text>
<text x="738" y="152" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="14" opacity="0" xml:space="preserve"><tspan fill="#818CF8">@RequestMapping</tspan><tspan fill="#34D399">("/api/reservas")</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.085;0.115;0.94;1" dur="9s" repeatCount="indefinite"/></text>
<text x="738" y="176" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="14" opacity="0" xml:space="preserve"><tspan fill="#22D3EE">public class </tspan><tspan fill="#E2E8F0">ControladorDisponibilidad</tspan><tspan fill="#94A3B8"> {</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.130;0.160;0.94;1" dur="9s" repeatCount="indefinite"/></text>
<text x="738" y="200" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="14" opacity="0" xml:space="preserve"><tspan fill="#818CF8">  @GetMapping</tspan><tspan fill="#34D399">("/disponibilidad")</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.175;0.205;0.94;1" dur="9s" repeatCount="indefinite"/></text>
<text x="738" y="224" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="14" opacity="0" xml:space="preserve"><tspan fill="#22D3EE">  public </tspan><tspan fill="#E2E8F0">List&lt;Espacio&gt; </tspan><tspan fill="#FCD34D">buscar</tspan><tspan fill="#94A3B8">() {</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.220;0.250;0.94;1" dur="9s" repeatCount="indefinite"/></text>
<text x="738" y="248" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="14" opacity="0" xml:space="preserve"><tspan fill="#22D3EE">    return </tspan><tspan fill="#E2E8F0">servicio</tspan><tspan fill="#FCD34D">.disponibles</tspan><tspan fill="#94A3B8">();</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.265;0.295;0.94;1" dur="9s" repeatCount="indefinite"/></text>
<text x="738" y="272" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="14" opacity="0" xml:space="preserve"><tspan fill="#94A3B8">  }</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.310;0.340;0.94;1" dur="9s" repeatCount="indefinite"/></text>
<text x="738" y="296" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="14" opacity="0" xml:space="preserve"><tspan fill="#94A3B8">}</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.355;0.385;0.94;1" dur="9s" repeatCount="indefinite"/></text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.45;0.94;1" dur="9s" repeatCount="indefinite"/>
    <rect x="1050" y="290" width="86" height="24" rx="12" fill="#34D399" fill-opacity="0.15" stroke="#34D399" stroke-opacity="0.6"/>
    <text x="1093" y="306" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" fill="#34D399">200 OK</text></g>
</g>
